name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_URL: ${{ secrets.REGISTRY_URL_PROD }}
  REGISTRY_USR: ${{ secrets.REGISTRY_USERNAME_PROD }}
  REGISTRY_PWD: ${{ secrets.REGISTRY_PASSWORD_PROD }}
  TAG: v${{ github.run_number }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3

    # Login to Harbor
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_URL }}
        username: ${{ env.REGISTRY_USR }}
        password: ${{ env.REGISTRY_PWD }}

    # 🔧 Build & push backend (also used by huey)
    - name: Build & Push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        tags: |
          ${{ env.REGISTRY_URL }}/dats-harici/ciso-backend:${{ env.TAG }}
        push: true

    # 🔧 Build & push frontend
    - name: Build & Push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        tags: |
          ${{ env.REGISTRY_URL }}/dats-harici/ciso-frontend:${{ env.TAG }}
        push: true

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY_URL: ${{ secrets.REGISTRY_URL_PROD }}
      REGISTRY_USR: ${{ secrets.REGISTRY_USERNAME_PROD }}
      REGISTRY_PWD: ${{ secrets.REGISTRY_PASSWORD_PROD }}
      TAG: v${{ github.run_number }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup SSH key
      run: |
        echo "${{ secrets.GCE_SSH_KEY }}" > key.pem
        chmod 600 key.pem

    - name: Copy docker-compose files to VM
      run: |
        ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.GCE_SSH_USER }}@${{ secrets.GCE_VM_EXTERNAL_IP }} "sudo mkdir -p /opt/ciso && sudo chown -R \$(whoami) /opt/ciso"
        scp -i key.pem -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.GCE_SSH_USER }}@${{ secrets.GCE_VM_EXTERNAL_IP }}:/opt/ciso/

        cat <<EOF > override.yml
        services:
          backend:
            image: $REGISTRY_URL/dats-harici/ciso-backend:$TAG
          frontend:
            image: $REGISTRY_URL/dats-harici/ciso-frontend:$TAG
          huey:
            image: $REGISTRY_URL/dats-harici/ciso-backend:$TAG
        EOF

        scp -i key.pem -o StrictHostKeyChecking=no override.yml ${{ secrets.GCE_SSH_USER }}@${{ secrets.GCE_VM_EXTERNAL_IP }}:/opt/ciso/docker-compose.override.yml

    - name: SSH and deploy
      run: |
        ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.GCE_SSH_USER }}@${{ secrets.GCE_VM_EXTERNAL_IP }} << EOF
          docker login $REGISTRY_URL -u $REGISTRY_USR -p $REGISTRY_PWD
          cd /opt/ciso
          docker compose down
          docker system prune -f
          docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
        EOF